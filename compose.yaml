services:
  postgre:
    container_name: kube-news-db
    image: postgres:${POSTGRES_TAG}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # informar qual o volume será usado
      - postgre_docker_volume:/var/lib/postgresql/data # utilizando docker volume
    networks: # informar qual a net que será usada
      - kube_news_net # nome da net utilizada para o container

  web:
    extends:
      file: ./kube-news.compose.yaml
      service: kube-news

volumes: # para criar volumes no docker compose
  postgre_docker_volume:
    name: postgre_volume

networks: # para criar network no docker compose
  kube_news_net: # nome da network
    name: kube_news_net
    driver: bridge # tipo de network