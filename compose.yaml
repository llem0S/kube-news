services:
  postgre:
    container_name: kube-news-db
    image: postgres:${POSTGRES_TAG}
    ports:
      - "5432:5432"
    profiles:
      - dev
      - hml
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # informar qual o volume será usado
      - postgre_docker_volume:/var/lib/postgresql/data # utilizando docker volume
    networks: # informar qual a net que será usada
      - kube_news_net # nome da net utilizada para o container

  kube-news:
    container_name: kube-news-web
    image: llem0s/kube-news:${KUBE_NEWS_TAG:-latest}
    build:
      context: ./src
      dockerfile: Dockerfile
    #depends_on: #[postgre] ,pode ser informado assim ou por lista
    #  - postgre
    ports:
      - "8080:8080"
    environment:
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgre
    networks:
      - kube_news_net

volumes: # para criar volumes no docker compose
  postgre_docker_volume:
    name: postgre_volume

networks: # para criar network no docker compose
  kube_news_net: # nome da network
    name: kube_news_net
    driver: bridge # tipo de network